<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" width="1100" height="760" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>jitsi-media-tools media pipeline</title>
  <style>
    .bg { fill: #ffffff; }
    .lane { fill: #f3f5f8; }
    .box { fill: #ffffff; stroke: #8a94a6; stroke-width: 1.2; }
    .ff { fill: #fff6e6; stroke: #c98a1b; }
    .srv { fill: #eef4ff; stroke: #4a6fb5; }
    .pb { stroke: #7c4dbd; stroke-width: 1.6; }
    .t { fill: #1f2733; font-size: 14px; font-weight: 600; text-anchor: middle; }
    .s { fill: #4b5566; font-size: 11.5px; text-anchor: middle; }
    .p { fill: #7c4dbd; font-size: 10.5px; font-weight: 600; text-anchor: middle; }
    .lbl { fill: #6b7486; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; }
    .media { stroke: #2f3a4c; stroke-width: 1.6; fill: none; }
    .sig { stroke: #4a6fb5; stroke-width: 1.4; fill: none; stroke-dasharray: 6 4; }
    .head { fill: #2f3a4c; }
    .shead { fill: #4a6fb5; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .lane { fill: #161b22; }
      .box { fill: #0d1117; stroke: #6e7681; }
      .ff { fill: #2a2112; stroke: #d29922; }
      .srv { fill: #121d33; stroke: #6e96e0; }
      .pb { stroke: #b392f0; }
      .t { fill: #e6edf3; }
      .s { fill: #9da7b3; }
      .p { fill: #b392f0; }
      .lbl { fill: #8b949e; }
      .media { stroke: #c9d1d9; }
      .sig { stroke: #6e96e0; }
      .head { fill: #c9d1d9; }
      .shead { fill: #6e96e0; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="head"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="shead"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1100" height="760"/>
  <text class="t" x="420" y="32" style="font-size:17px">jitsi-media-tools media pipeline</text>

  <!-- Jitsi server -->
  <rect class="box srv" x="840" y="196" width="245" height="386" rx="10"/>
  <text class="t" x="962" y="216">Jitsi Meet server</text>
  <rect class="box" x="850" y="352" width="100" height="74" rx="6"/>
  <text class="t" x="900" y="376">Jicofo</text>
  <text class="s" x="900" y="395">Prosody</text>
  <text class="s" x="900" y="411">(XMPP)</text>
  <rect class="box" x="965" y="230" width="110" height="340" rx="6"/>
  <text class="t" x="1020" y="380">Videobridge</text>
  <text class="s" x="1020" y="399">forwards RTP,</text>
  <text class="s" x="1020" y="415">video selection</text>

  <!-- WHIP gateway lane: no ffmpeg, packets passed through -->
  <rect class="lane" x="10" y="52" width="810" height="132" rx="8"/>
  <text class="lbl" x="22" y="70">WHIP GATEWAY (serve): NO FFMPEG</text>

  <rect class="box" x="20" y="80" width="150" height="90" rx="6"/>
  <text class="t" x="95" y="104">OBS</text>
  <text class="s" x="95" y="124">WHIP output, H.264</text>
  <text class="s" x="95" y="140">and Opus encoded by OBS</text>

  <rect class="box pb" x="215" y="80" width="170" height="90" rx="6"/>
  <text class="t" x="300" y="104">Ingest peer (peer)</text>
  <text class="s" x="300" y="124">SDP offer/answer over</text>
  <text class="s" x="300" y="140">HTTP (whip), one per stream</text>
  <text class="p" x="300" y="158">Pion: webrtc · ice · rtcp</text>

  <rect class="box pb" x="430" y="80" width="165" height="90" rx="6"/>
  <text class="t" x="512" y="104">Forwarder (session)</text>
  <text class="s" x="512" y="124">RTP passed through,</text>
  <text class="s" x="512" y="140">no decoding, no pacing</text>
  <text class="p" x="512" y="158">Pion: rtp</text>

  <path class="sig" d="M172,106 H213" marker-start="url(#b)" marker-end="url(#b)"/>
  <path class="media" d="M170,140 H213" marker-end="url(#a)"/>
  <path class="media" d="M385,125 H428" marker-end="url(#a)"/>
  <text class="s" x="648" y="117">unchanged</text>

  <!-- Publish lane -->
  <rect class="lane" x="10" y="196" width="810" height="132" rx="8"/>
  <text class="lbl" x="22" y="214">PUBLISH (join --publish)</text>

  <rect class="box" x="20" y="224" width="150" height="90" rx="6"/>
  <text class="t" x="95" y="248">Publish source</text>
  <text class="s" x="95" y="268">file · camera + mic</text>
  <text class="s" x="95" y="284">jmt.FrameSource</text>

  <rect class="box ff" x="215" y="224" width="170" height="90" rx="6"/>
  <text class="t" x="300" y="248">ffmpeg encoder</text>
  <text class="s" x="300" y="268">VP8 → IVF on stdout</text>
  <text class="s" x="300" y="284">Opus → Ogg on TCP</text>

  <rect class="box pb" x="430" y="224" width="165" height="90" rx="6"/>
  <text class="t" x="512" y="248">Sender (rtpmedia)</text>
  <text class="s" x="512" y="268">parse IVF / Ogg frames</text>
  <text class="s" x="512" y="284">pace, packetize to RTP</text>
  <text class="p" x="512" y="302">Pion: rtp codecs · ivfreader</text>

  <rect class="box pb" x="640" y="224" width="150" height="90" rx="6"/>
  <text class="t" x="715" y="248">WebRTC peer (peer)</text>
  <text class="s" x="715" y="268">video + audio tracks</text>
  <text class="s" x="715" y="284">ICE, DTLS-SRTP, RTCP</text>
  <text class="p" x="715" y="302">Pion: webrtc · interceptor</text>

  <path class="media" d="M170,269 H213" marker-end="url(#a)"/>
  <path class="media" d="M385,269 H428" marker-end="url(#a)"/>
  <path class="media" d="M595,269 H638" marker-end="url(#a)"/>
  <path class="media" d="M790,269 H963" marker-end="url(#a)"/>
  <text class="s" x="877" y="261">RTP</text>

  <!-- Signaling -->
  <rect class="box srv pb" x="640" y="344" width="150" height="90" rx="6"/>
  <text class="t" x="715" y="368">Signaling (jitsi)</text>
  <text class="s" x="715" y="388">XMPP over WebSocket</text>
  <text class="s" x="715" y="404">Jingle ↔ SDP, presence</text>
  <text class="p" x="715" y="422">Pion: sdp</text>
  <path class="sig" d="M715,316 V342" marker-start="url(#b)" marker-end="url(#b)"/>
  <path class="sig" d="M792,389 H848" marker-start="url(#b)" marker-end="url(#b)"/>

  <!-- Receive lane -->
  <rect class="lane" x="10" y="450" width="810" height="132" rx="8"/>
  <text class="lbl" x="22" y="468">RECEIVE</text>

  <rect class="box pb" x="640" y="478" width="150" height="90" rx="6"/>
  <text class="t" x="715" y="502">WebRTC peer (peer)</text>
  <text class="s" x="715" y="522">one RTP track</text>
  <text class="s" x="715" y="538">per received stream</text>
  <text class="p" x="715" y="556">Pion: webrtc · interceptor</text>

  <rect class="box pb" x="430" y="478" width="165" height="90" rx="6"/>
  <text class="t" x="512" y="502">Frame assembler</text>
  <text class="s" x="512" y="522">(rtpmedia) frame at marker</text>
  <text class="s" x="512" y="538">→ IVF · Annex B · Ogg</text>
  <text class="p" x="512" y="556">Pion: rtp codecs · oggwriter</text>

  <rect class="box ff" x="215" y="478" width="170" height="90" rx="6"/>
  <text class="t" x="300" y="502">ffmpeg decoder</text>
  <text class="s" x="300" y="522">one per stream, on stdin</text>
  <text class="s" x="300" y="538">→ yuv420p · s16le 48 kHz</text>

  <rect class="box" x="20" y="478" width="150" height="90" rx="6"/>
  <text class="t" x="95" y="502">Room (compose)</text>
  <text class="s" x="95" y="522">tile grid 1280×720</text>
  <text class="s" x="95" y="538">30 fps + audio mix</text>

  <path class="media" d="M963,523 H792" marker-end="url(#a)"/>
  <text class="s" x="877" y="515">RTP</text>
  <path class="media" d="M640,523 H597" marker-end="url(#a)"/>
  <path class="media" d="M430,523 H387" marker-end="url(#a)"/>
  <path class="media" d="M215,523 H172" marker-end="url(#a)"/>

  <!-- Outputs -->
  <text class="lbl" x="22" y="612">OUTPUTS</text>
  <path class="media" d="M95,568 V598 H680"/>
  <path class="media" d="M110,598 V618" marker-end="url(#a)"/>
  <path class="media" d="M300,598 V618" marker-end="url(#a)"/>
  <path class="media" d="M490,598 V618" marker-end="url(#a)"/>
  <path class="media" d="M680,598 V618" marker-end="url(#a)"/>

  <rect class="box" x="20" y="620" width="180" height="70" rx="6"/>
  <text class="t" x="110" y="644">Window</text>
  <text class="s" x="110" y="663">NUT on stdin → ffplay</text>
  <text class="s" x="110" y="679">(--display)</text>

  <rect class="box" x="210" y="620" width="180" height="70" rx="6"/>
  <text class="t" x="300" y="644">Library callbacks</text>
  <text class="s" x="300" y="663">OnVideo · OnAudio</text>
  <text class="s" x="300" y="679">OnGrid · OnMixedAudio</text>

  <rect class="box" x="400" y="620" width="180" height="70" rx="6"/>
  <text class="t" x="490" y="644">Recording</text>
  <text class="s" x="490" y="663">.mkv per participant</text>
  <text class="s" x="490" y="679">or mixed (--record)</text>

  <rect class="box" x="590" y="620" width="180" height="70" rx="6"/>
  <text class="t" x="680" y="644">SRT feeds</text>
  <text class="s" x="680" y="663">for OBS Media Sources</text>
  <text class="s" x="680" y="679">(--obs, --obs-grid)</text>

  <!-- Drawn over the lanes they enter -->
  <path class="media" d="M595,125 H700 V222" marker-end="url(#a)"/>
  <path class="sig" d="M715,436 V476" marker-end="url(#b)"/>

  <!-- Legend -->
  <path class="media" d="M22,730 H62" marker-end="url(#a)"/>
  <text class="s" x="68" y="734" style="text-anchor:start">media</text>
  <path class="sig" d="M130,730 H170" marker-end="url(#b)"/>
  <text class="s" x="176" y="734" style="text-anchor:start">signaling</text>
  <rect class="box ff" x="258" y="722" width="22" height="16" rx="3"/>
  <text class="s" x="286" y="734" style="text-anchor:start">ffmpeg process</text>
  <rect class="box pb" x="390" y="722" width="22" height="16" rx="3"/>
  <text class="s" x="418" y="734" style="text-anchor:start">uses Pion (Go WebRTC libraries; purple line: which ones)</text>
</svg>
